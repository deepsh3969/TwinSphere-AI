services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL:-sqlite:////data/twinsphere.db}
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-me-in-production}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173,http://localhost}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      SENSOR_TICK_SECONDS: ${SENSOR_TICK_SECONDS:-2.0}
      SIMULATION_SPEED: ${SIMULATION_SPEED:-1.0}
    volumes:
      - twin-data:/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

  # Optional: start with `docker compose --profile postgres up`
  # and DATABASE_URL=postgresql+psycopg2://twin:twin@postgres:5432/twinsphere
  postgres:
    image: postgres:16-alpine
    profiles: ["postgres"]
    environment:
      POSTGRES_USER: twin
      POSTGRES_PASSWORD: twin
      POSTGRES_DB: twinsphere
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

volumes:
  twin-data:
  pgdata:
